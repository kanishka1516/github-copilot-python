<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="title-group">
        <h1>Sudoku Game</h1>
        <p class="subtitle">Play, check your progress, and enjoy a calm puzzle experience.</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__label">Dark mode</span>
      </button>
    </header>

    <div class="controls">
      <label class="difficulty-picker" for="difficulty-select">
        <span class="difficulty-picker__label">Difficulty</span>
        <select id="difficulty-select" name="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <button id="new-game">New Game</button>
      <button id="hint-cell">Hint</button>
      <button id="check-solution">Check Solution</button>
      <span id="timer-display">Time: 00:00</span>
      <span id="message"></span>
    </div>

    <div id="sudoku-board" class="sudoku-board" aria-label="Sudoku board"></div>

    <section class="leaderboard-card" aria-labelledby="leaderboard-title">
      <div class="leaderboard-card__header">
        <h2 id="leaderboard-title">Top 10 Leaderboard</h2>
        <label class="leaderboard-name" for="player-name">
          <span class="leaderboard-name__label">Player name</span>
          <input id="player-name" name="player-name" type="text" maxlength="24" placeholder="Anonymous" autocomplete="nickname">
        </label>
      </div>
      <ul id="leaderboard-list" class="leaderboard-list" aria-live="polite"></ul>
    </section>
  </main>

  <script src="/static/main.js"></script>
</body>
</html>
